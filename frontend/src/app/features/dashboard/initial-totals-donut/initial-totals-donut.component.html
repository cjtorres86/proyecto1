@if (metricas) {
  <div class="grid grid-cols-2 gap-4">
    <div class="flex flex-col divide-y divide-dotted divide-gray-200 border-r border-dotted border-gray-200 pr-4">
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <div
          [appSlepBreakdown]="'Q04'"
          #tipQ04="appSlepBreakdown"
          [pTooltip]="tipQ04.texto"
          [escape]="false"
          tooltipPosition="left"
          tooltipStyleClass="text-xs"
          class="text-2xl font-bold"
        >
          {{ metricas.totalCasos }}
        </div>
        <div class="text-xs text-gray-500">Total casos CGR (C04)</div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <div
          [appSlepBreakdown]="'Q05'"
          #tipQ05="appSlepBreakdown"
          [pTooltip]="tipQ05.texto"
          [escape]="false"
          tooltipPosition="left"
          tooltipStyleClass="text-xs"
          class="text-2xl font-bold"
        >
          {{ metricas.totalLicencias }}
        </div>
        <div class="text-xs text-gray-500">Total licencias incumplidas (C05)</div>
      </div>
    </div>
    <div>
      <div class="text-xs text-gray-500 text-center mb-1">Total funcionarios involucrados (C06)</div>
      <div class="relative mx-auto" style="width: 220px; height: 220px;">
        <svg viewBox="0 0 200 200" class="w-full h-full">
          <!-- Base: "Ya no están", círculo completo detrás -->
          <circle cx="100" cy="100" [attr.r]="radio" fill="none" stroke="#60A5FA" [attr.stroke-width]="grosor" />
          <!-- "Continúan", arco parcial encima — empieza arriba (12 en punto) -->
          <circle
            cx="100"
            cy="100"
            [attr.r]="radio"
            fill="none"
            stroke="#1E3A8A"
            [attr.stroke-width]="grosor"
            [attr.stroke-dasharray]="dasharrayAnimado"
            transform="rotate(-90 100 100)"
            class="transition-all duration-700 ease-out"
          />
        </svg>
        <div
          [appSlepBreakdown]="'Q06'"
          #tipQ06="appSlepBreakdown"
          [pTooltip]="tipQ06.texto"
          [escape]="false"
          tooltipPosition="left"
          tooltipStyleClass="text-xs"
          class="absolute inset-0 flex items-center justify-center text-xl font-bold"
        >
          {{ metricas.totalFuncionarios }}
        </div>
      </div>
      <div class="flex justify-center gap-3 text-xs mt-2 text-gray-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:#1E3A8A"></span>Continúan ({{ metricas.continuanServicio }})</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:#60A5FA"></span>Ya no están ({{ metricas.yaNoEstan }})</span>
      </div>
    </div>
  </div>
}
