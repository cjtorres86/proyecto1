<div class="bg-white rounded-lg shadow p-4">
  <div class="grid grid-cols-2 gap-6 items-center">
    <div class="text-center">
      <div class="text-4xl font-bold" [style.color]="color">{{ pct === null ? '—' : pct + '%' }}</div>
      <div class="text-xs text-gray-500 uppercase tracking-wide mt-1 leading-relaxed">
        Avance de Sumarios<br />(Procesos Cerrados ÷ Sumarios Instruidos)
      </div>
    </div>
    <div>
      <div class="relative h-4 rounded-full bg-gray-100 shadow-inner overflow-hidden">
        <div
          class="absolute inset-y-0 left-0 rounded-full transition-all duration-700 ease-out"
          [style.width.%]="anchoAnimado"
          [style.background]="color"
        ></div>
        <!-- marcas tipo regla, en 25 / 50 / 75 -->
        <div class="absolute inset-y-0 left-1/4 w-px bg-white/50"></div>
        <div class="absolute inset-y-0 left-1/2 w-px bg-white/70"></div>
        <div class="absolute inset-y-0 left-3/4 w-px bg-white/50"></div>
      </div>
      <div class="relative mt-1 h-3 text-[10px] text-gray-400 font-medium">
        <span class="absolute left-0">0</span>
        <span class="absolute left-1/2 -translate-x-1/2 font-semibold text-gray-500">50</span>
        <span class="absolute right-0">100</span>
      </div>
    </div>
  </div>
</div>
