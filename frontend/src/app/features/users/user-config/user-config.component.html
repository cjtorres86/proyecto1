<div class="flex justify-between items-center mb-3">
  <h2 class="font-bold">Usuarios</h2>
  <button mat-flat-button class="!bg-[#1E3A8A] !text-white" (click)="abrirNuevoUsuario()">+ Nuevo usuario</button>
</div>
<p-table [value]="usuarios" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr><th>Usuario</th><th>Nombre</th><th>Perfil</th><th>Alcance</th></tr>
  </ng-template>
  <ng-template pTemplate="body" let-u>
    <tr>
      <td>{{ u.usuario }}</td>
      <td>{{ u.nombreParaMostrar }}</td>
      <td>{{ u.esSuperadmin ? 'Superadmin' : u.perfil?.nombre }}</td>
      <td>{{ u.alcance }}</td>
    </tr>
  </ng-template>
</p-table>
