<div class="flex flex-col h-full">
  <!-- Botones en la esquina superior derecha, mismo estilo que el resto de
       los paneles. Cerrar y Eliminar actúan sobre el mes elegido (cada uno
       lo explica al pasar el mouse); textos cortos para que quepan en una
       línea junto al título. -->
  <div class="cab-panel">
    <h3 class="font-bold text-sm uppercase text-gray-500">Meses</h3>
    <div>
      @if (authService.can('crear_mes')) {
        <button class="text-xs border border-blue-800 text-blue-800 rounded px-2 py-1 cursor-pointer" title="Agregar un mes" (click)="abrirAgregarMes()">+ Agregar</button>
      }
      <!-- El botón se transforma según el estado del mes elegido: "Cerrar
           mes" en uno abierto (Admin/Validador/superadmin), "Abrir mes" en
           uno cerrado (exclusivo del superadmin — nadie más deshace un
           cierre). -->
      @if (!mesActivoCerrado && authService.can('cerrar_mes')) {
        <button
          class="text-xs border border-blue-800 text-blue-800 rounded px-2 py-1 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="!mesActivo"
          [title]="!mesActivo ? 'Selecciona un mes primero' : 'Cerrar el mes para todos'"
          (click)="cerrarMesActivo()"
        >
          Cerrar
        </button>
      }
      @if (mesActivoCerrado && authService.can('reabrir_mes')) {
        <button
          class="text-xs border border-blue-800 text-blue-800 rounded px-2 py-1 cursor-pointer"
          title="Reabrir el mes para todos"
          (click)="abrirMesActivo()"
        >
          Abrir
        </button>
      }
      @if (authService.can('eliminar_mes')) {
        <button
          class="text-xs border border-red-700 text-red-700 rounded px-2 py-1 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="!mesActivo"
          [title]="!mesActivo ? 'Selecciona un mes primero' : 'Eliminar el mes de la vista (los datos se conservan)'"
          (click)="eliminarMesActivo()"
        >
          Eliminar
        </button>
      }
    </div>
  </div>
  <div class="flex-1 overflow-auto flex flex-col gap-1">
    @for (m of meses; track m.mes + m.anio) {
      <button
        class="text-left px-2 py-1.5 rounded text-sm border flex items-center justify-between gap-2"
        [class.bg-blue-900]="esActivo(m)"
        [class.text-white]="esActivo(m)"
        [class.border-gray-200]="!esActivo(m)"
        (click)="seleccionar(m)">
        <span>{{ m.mes }} {{ m.anio }}</span>
        @if (m.cerrado) {
          <i class="pi pi-lock text-[11px] opacity-70" title="Mes cerrado" aria-label="Mes cerrado"></i>
        }
      </button>
    }
  </div>
</div>
