<div class="flex flex-col h-full">
  <div class="flex justify-between items-center mb-2 gap-2">
    <h3 class="font-bold text-sm uppercase text-gray-500">SLEP</h3>
    <div class="flex gap-1">
      <!-- La etiqueta muestra lo que hará AL PRESIONAR, no el orden
           actual: dice "Por avance" mientras está en A-Z (invita a
           cambiar a avance), y "A-Z" mientras está por avance. -->
      <button
        class="text-xs border border-blue-800 text-blue-800 rounded px-2 py-1 cursor-pointer"
        [title]="ordenPorRanking ? 'Volver a orden alfabético' : 'Ordenar por avance'"
        (click)="alternarOrden()"
      >
        {{ ordenPorRanking ? 'A-Z' : 'Por avance' }}
      </button>
    </div>
  </div>
  @if ((contenedoresOrdenados$ | async)?.length) {
    <div class="flex-1 overflow-auto flex flex-col gap-1">
      @for (c of contenedoresOrdenados$ | async; track c.id) {
        <div
          class="px-2 py-1.5 rounded text-sm border cursor-pointer"
          [class.bg-gray-200]="esDestacado(c)"
          [class.border-gray-400]="esDestacado(c)"
          [class.bg-gray-100]="esMarcadoSecundario(c)"
          [class.border-gray-200]="!esDestacado(c) && !esMarcadoSecundario(c)"
          [class.font-bold]="tieneDatos(c)"
          (click)="seleccionar(c)">
          {{ c.slep }}
        </div>
      }
    </div>
  } @else {
    <p class="text-sm text-gray-400">Selecciona un mes en el panel anterior.</p>
  }
</div>
