<h2 mat-dialog-title>Descargar</h2>
<mat-dialog-content>
  <div class="flex flex-col gap-2">
    @if (alcanceEsTodos && authService.can('exportar_excel')) {
      <button mat-stroked-button [disabled]="descargando" (click)="descargarExcelGeneral()">Consolidado General (Excel)</button>
    }
    @if (authService.can('exportar_excel')) {
      <button mat-stroked-button [disabled]="descargando" (click)="descargarExcelPorSlep()">{{ textoConsolidadoPorSlep }} (Excel)</button>
    }
    @if (authService.can('exportar_informe')) {
      <button mat-stroked-button [disabled]="descargando" (click)="verInforme()">Informe Interactivo</button>
      <button mat-stroked-button [disabled]="descargando" (click)="descargarPDF()">PDF</button>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
