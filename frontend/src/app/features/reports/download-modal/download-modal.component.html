<div class="w-[440px] max-w-full">
  <header class="px-5 pt-5 pb-3">
    <h2 class="text-base font-medium text-gray-900 m-0">Descargar</h2>
    <p class="text-xs text-gray-500 mt-0.5">
      {{ data.slep ? data.mes + ' ' + data.anio + ', ' + data.slep : data.mes + ' ' + data.anio }}
    </p>
  </header>

  <div class="px-2 pb-2 max-h-[70vh] overflow-auto">
    @for (op of opciones; track op.titulo) {
      <!-- Divisor sutil entre Excel / Informe General / Informe de Errores:
           antes de cada fila "Interactivo", salvo la primera de la lista. -->
      @if (op.tipo === 'html' && !$first) {
        <div class="h-px bg-gray-100 mx-3 my-1.5"></div>
      }
      <button
        type="button"
        class="w-full flex items-center gap-3 text-left px-3 py-2.5 rounded-lg cursor-pointer border-none bg-transparent hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        [disabled]="descargando"
        (click)="op.accion()"
      >
        <!-- Documento con esquina doblada, mismo trazo en los 3 formatos —
             solo cambian el color y el glifo interior, para que se lean
             como una misma familia de íconos. -->
        <svg viewBox="0 0 32 32" class="w-9 h-9 shrink-0" aria-hidden="true">
          @switch (op.tipo) {
            @case ('excel') {
              <path d="M8 2h11l5 5v21a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#1D6F42" />
              <path d="M19 2v5h5Z" fill="#154A2C" />
              <rect x="9.5" y="16" width="5" height="5" rx="1" fill="white" fill-opacity=".92" />
              <rect x="16" y="16" width="5" height="5" rx="1" fill="white" fill-opacity=".92" />
              <rect x="9.5" y="22.2" width="5" height="5" rx="1" fill="white" fill-opacity=".92" />
              <rect x="16" y="22.2" width="5" height="5" rx="1" fill="white" fill-opacity=".92" />
            }
            @case ('pdf') {
              <path d="M8 2h11l5 5v21a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#C4291F" />
              <path d="M19 2v5h5Z" fill="#8C1C15" />
              <text x="16" y="25.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="Roboto, Arial, sans-serif">PDF</text>
            }
            @case ('html') {
              <path d="M8 2h11l5 5v21a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#0E7490" />
              <path d="M19 2v5h5Z" fill="#0A505F" />
              <text x="16" y="25" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="'Courier New', monospace">&lt;/&gt;</text>
            }
          }
        </svg>

        <span class="min-w-0">
          <span class="block text-[13px] font-medium text-gray-900 leading-snug">{{ op.titulo }}</span>
          <span class="block text-xs text-gray-500 leading-snug mt-0.5">{{ op.descripcion }}</span>
        </span>
      </button>
    }

    @if (!opciones.length) {
      <p class="text-sm text-gray-400 px-3 py-4">No tienes descargas disponibles para este mes.</p>
    }
  </div>

  <footer class="flex justify-end px-4 py-3 border-t border-gray-100">
    <button mat-button (click)="cerrar()">Cerrar</button>
  </footer>
</div>
