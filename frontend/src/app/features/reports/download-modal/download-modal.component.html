<h2 mat-dialog-title>Descargar</h2>
<mat-dialog-content>
  @if (data.slep) {
    <p class="text-xs text-gray-500 -mt-2 mb-2">Informe y PDF: solo {{ data.slep }}</p>
  }
  <div class="flex flex-col gap-2">
    @if (alcanceEsTodos && authService.can('exportar_excel')) {
      <button mat-stroked-button [disabled]="descargando" (click)="descargarExcelGeneral()">Consolidado por Mes (Excel)</button>
    }
    @if (authService.can('exportar_excel')) {
      <button mat-stroked-button [disabled]="descargando" (click)="descargarExcelPorSlep()">{{ textoConsolidadoPorSlep }} (Excel)</button>
    }
    @if (authService.can('exportar_informe')) {
      <button mat-stroked-button [disabled]="descargando" (click)="verInformeGeneral()">Informe General — Interactivo</button>
      <button mat-stroked-button [disabled]="descargando" (click)="descargarPDFGeneral()">Informe General — PDF</button>
      <!-- Informe de Errores (mejora post-v2.23): mismo permiso que el
           Informe General — reutiliza la misma pantalla de Errores del
           sistema, solo que compuesta como su propio informe imprimible. -->
      <button mat-stroked-button [disabled]="descargando" (click)="verInformeErrores()">Informe de Errores — Interactivo</button>
      <button mat-stroked-button [disabled]="descargando" (click)="descargarPDFErrores()">Informe de Errores — PDF</button>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
