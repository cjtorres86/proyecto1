services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: gdp_slep
      MYSQL_USER: gdp_app
      MYSQL_PASSWORD: gdp_app_dev_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: gdp_app
      DB_PASSWORD: gdp_app_dev_pw
      DB_DATABASE: gdp_slep
      JWT_SECRET: CAMBIAR_EN_PRODUCCION
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
